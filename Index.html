const ROLES={B:'Batters',W:'Wicketkeepers',A:'All-rounders',P:'Fast bowlers',S:'Spinners'};
const ORDER='BWAPS', IDEAL={B:3,W:1,A:3,P:3,S:1}, MINB=20;
const RAW=`Virat Kohli,B,0,200;Rohit Sharma,B,0,200;Shubman Gill,B,0,200;Suryakumar Yadav,B,0,200;Yashasvi Jaiswal,B,0,200;Shreyas Iyer,B,0,200;Ruturaj Gaikwad,B,0,150;Tilak Varma,B,0,100;Travis Head,B,1,200;David Warner,B,1,200;Rinku Singh,B,0,100;Rajat Patidar,B,0,100;Abhishek Sharma,B,0,100;Kane Williamson,B,1,150;Faf du Plessis,B,1,150;
KL Rahul,W,0,200;Rishabh Pant,W,0,200;Sanju Samson,W,0,200;MS Dhoni,W,0,200;Ishan Kishan,W,0,150;Jos Buttler,W,1,200;Heinrich Klaasen,W,1,200;Phil Salt,W,1,150;Nicholas Pooran,W,1,150;
Ravindra Jadeja,A,0,200;Hardik Pandya,A,0,200;Glenn Maxwell,A,1,200;Andre Russell,A,1,200;Sunil Narine,A,1,200;Marcus Stoinis,A,1,150;Axar Patel,A,0,150;Washington Sundar,A,0,100;Shivam Dube,A,0,100;Liam Livingstone,A,1,150;Sam Curran,A,1,200;Cameron Green,A,1,200;
Jasprit Bumrah,P,0,200;Mohammed Shami,P,0,200;Mohammed Siraj,P,0,200;Arshdeep Singh,P,0,150;Pat Cummins,P,1,200;Mitchell Starc,P,1,200;Trent Boult,P,1,200;Kagiso Rabada,P,1,200;Bhuvneshwar Kumar,P,0,150;Harshal Patel,P,0,100;T Natarajan,P,0,100;Mayank Yadav,P,0,100;
Yuzvendra Chahal,S,0,200;Kuldeep Yadav,S,0,200;Rashid Khan,S,1,200;Ravi Bishnoi,S,0,100;Varun Chakravarthy,S,0,150;Wanindu Hasaranga,S,1,150;Adam Zampa,S,1,150;R Ashwin,S,0,150`;
const ALL=RAW.split(/;\s*/).map(x=>{const [n,r,o,b]=x.trim().split(',');return {n,r,o:+o,b:+b};});
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=l=>'₹'+(+(l/100).toFixed(2))+' Cr';
const osn=p=>p.sq.filter(x=>x.o).length;
const byRole=a=>[...a].sort((x,y)=>ORDER.indexOf(x.r)-ORDER.indexOf(y.r));

function newPool(){
  const cnt={B:7,W:4,A:7,P:7,S:5}; let pool=[],rest=[];
  for(const r of ORDER){const s=shuf(ALL.filter(p=>p.r===r));pool.push(...s.slice(0,cnt[r]));rest.push(...s.slice(cnt[r]));}
  return {pool:byRole(pool),res:shuf(rest)};
}
function newGame(hostId,hostName,bot){
  const {pool,res}=newPool();
  const mk=(id,name)=>({id,name,purse:10000,sq:[]});
  return {status:'lobby',round:1,pool,res,i:0,unsold:[],log:[],last:'',hype:0,
    p:{A:mk(hostId,hostName),B:bot?{...mk('bot','Bot'),bot:bot}:null},
    bid:{amt:0,by:null,end:0},bv:0};
}
function canBid(s,side,amt){
  const p=s.p[side],pl=s.pool[s.i]; if(!p||!pl) return false;
  const slots=11-p.sq.length; if(slots<=0) return false;
  if(pl.o&&osn(p)>=4) return false;
  if(amt<pl.b) return false;
  return amt<=p.purse-(slots-1)*MINB;
}
function startItem(s,now){
  const pl=s.pool[s.i]; const m={aggressive:1.6,balanced:1.1,frugal:0.75}[s.p.B&&s.p.B.bot]||1;
  s.bv=Math.round(pl.b*(1.2+Math.random()*2.2)*m/5)*5;
  s.bid={amt:0,by:null,end:now+11000};
}
function advance(s,now){
  s.i++;
  const full=['A','B'].every(k=>s.p[k].sq.length>=11);
  if(full){s.status='done';return s;}
  if(s.i>=s.pool.length){
    if(s.round>=3){s.status='done';return s;}
    const extra=s.res.splice(0,6);
    s.pool=byRole([...s.unsold,...extra]);s.unsold=[];s.i=0;s.round++;
    s.last+=` — RE-AUCTION round ${s.round}!`;
    if(!s.pool.length){s.status='done';return s;}
  }
  // skip players nobody can bid for
  let guard=0;
  while(s.i<s.pool.length&&!['A','B'].some(k=>canBid(s,k,s.pool[s.i].b))&&guard++<40){s.unsold.push(s.pool[s.i]);s.i++;}
  if(s.i>=s.pool.length) return advance({...s,i:s.pool.length-1},now);
  startItem(s,now);return s;
}
function step(s,now){
  if(s.status!=='live') return s;
  const left=s.bid.end-now;
  if(left<=0){
    const n=JSON.parse(JSON.stringify(s)),pl=n.pool[n.i];
    if(n.bid.by){
      const w=n.p[n.bid.by];w.purse-=n.bid.amt;w.sq.push({...pl,c:n.bid.amt});
      n.last=`🔨 SOLD! ${pl.n} to ${w.name} for ${fmt(n.bid.amt)}!`;
      n.log.unshift(`${pl.n} → ${w.name} ${fmt(n.bid.amt)}`);
    } else {n.unsold.push(pl);n.last=`❌ ${pl.n} goes UNSOLD.`;n.log.unshift(`${pl.n} unsold`);}
    return advance(n,now);
  }
  const b=s.p.B; if(b&&b.id==='bot'&&s.bid.by!=='B'&&Math.random()<0.12){
    const pl=s.pool[s.i],has=s.bid.by!==null;
    const cnt=b.sq.filter(x=>x.r===pl.r).length;
    const need=cnt<IDEAL[pl.r]?1.35:cnt>IDEAL[pl.r]?0.5:1;
    const amt=has?s.bid.amt+[10,25,25,50][Math.floor(Math.random()*4)]:pl.b;
    if(amt<=s.bv*need&&canBid(s,'B',amt))
      return {...s,hype:s.hype+1,bid:{amt,by:'B',end:now+8000}};
  }
  return s;
}

function Roster({p,title,color}){
  const os=osn(p),slots=11-p.sq.length;
  return html`<div class="bg-slate-900 border-t-4 ${color} rounded-2xl p-3">
    <div class="font-black">${title} — ${p.sq.length}/11</div>
    <div class="space-y-1 my-2 max-h-36 overflow-y-auto text-sm">
      ${p.sq.map((x,k)=>html`<div key=${k} class="flex justify-between bg-slate-950 rounded px-2 py-1"><span class="truncate mr-1">${x.o?'🌍 ':''}${x.n} <i class="text-slate-500">${x.r}</i></span><b>${fmt(x.c)}</b></div>`)}
      ${!p.sq.length&&html`<div class="text-slate-500 italic">No players yet</div>`}
    </div>
    <div class="text-sm">💰 Purse remaining: <b>${fmt(p.purse)}</b></div>
    <div class="text-sm">🌍 Overseas: <b>${os}/4</b> • Need <b>${slots}</b> more</div>
  </div>`;
}

            }
          }
        }
