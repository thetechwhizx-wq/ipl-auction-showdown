<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPL Auction Showdown</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#020617;color:#e2e8f0;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);
const ROLES={B:'Batters',W:'Wicketkeepers',A:'All-rounders',P:'Fast bowlers',S:'Spinners'};
const ORDER='BWAPS', IDEAL={B:3,W:1,A:3,P:3,S:1}, MINB=20;
const RAW=`Virat Kohli,B,0,200;Rohit Sharma,B,0,200;Shubman Gill,B,0,200;Suryakumar Yadav,B,0,200;Yashasvi Jaiswal,B,0,200;Shreyas Iyer,B,0,200;Ruturaj Gaikwad,B,0,150;Tilak Varma,B,0,100;Travis Head,B,1,200;David Warner,B,1,200;Rinku Singh,B,0,100;Rajat Patidar,B,0,100;Abhishek Sharma,B,0,100;Kane Williamson,B,1,150;Faf du Plessis,B,1,150;
KL Rahul,W,0,200;Rishabh Pant,W,0,200;Sanju Samson,W,0,200;MS Dhoni,W,0,200;Ishan Kishan,W,0,150;Jos Buttler,W,1,200;Heinrich Klaasen,W,1,200;Phil Salt,W,1,150;Nicholas Pooran,W,1,150;
Ravindra Jadeja,A,0,200;Hardik Pandya,A,0,200;Glenn Maxwell,A,1,200;Andre Russell,A,1,200;Sunil Narine,A,1,200;Marcus Stoinis,A,1,150;Axar Patel,A,0,150;Washington Sundar,A,0,100;Shivam Dube,A,0,100;Liam Livingstone,A,1,150;Sam Curran,A,1,200;Cameron Green,A,1,200;
Jasprit Bumrah,P,0,200;Mohammed Shami,P,0,200;Mohammed Siraj,P,0,200;Arshdeep Singh,P,0,150;Pat Cummins,P,1,200;Mitchell Starc,P,1,200;Trent Boult,P,1,200;Kagiso Rabada,P,1,200;Bhuvneshwar Kumar,P,0,150;Harshal Patel,P,0,100;T Natarajan,P,0,100;Mayank Yadav,P,0,100;
Yuzvendra Chahal,S,0,200;Kuldeep Yadav,S,0,200;Rashid Khan,S,1,200;Ravi Bishnoi,S,0,100;Varun Chakravarthy,S,0,150;Wanindu Hasaranga,S,1,150;Adam Zampa,S,1,150;R Ashwin,S,0,150`;
const ALL=RAW.split(/;\s*/).map(x=>{const [n,r,o,b]=x.trim().split(',');return {n,r,o:+o,b:+b};});
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=l=>'₹'+(+(l/100).toFixed(2))+' Cr';
const osn=p=>p.sq.filter(x=>x.o).length;
const byRole=a=>[...a].sort((x,y)=>ORDER.indexOf(x.r)-ORDER.indexOf(y.r));

function newPool(){
  const cnt={B:7,W:4,A:7,P:7,S:5}; let pool=[],rest=[];
  for(const r of ORDER){const s=shuf(ALL.filter(p=>p.r===r));pool.push(...s.slice(0,cnt[r]));rest.push(...s.slice(cnt[r]));}
  return {pool:byRole(pool),res:shuf(rest)};
}
function newGame(hostId,hostName,bot){
  const {pool,res}=newPool();
  const mk=(id,name)=>({id,name,purse:10000,sq:[]});
  return {status:'lobby',round:1,pool,res,i:0,unsold:[],log:[],last:'',hype:0,
    p:{A:mk(hostId,hostName),B:bot?{...mk('bot','Bot'),bot:bot}:null},
    bid:{amt:0,by:null,end:0},bv:0};
}
function canBid(s,side,amt){
  const p=s.p[side],pl=s.pool[s.i]; if(!p||!pl) return false;
  const slots=11-p.sq.length; if(slots<=0) return false;
  if(pl.o&&osn(p)>=4) return false;
  if(amt<pl.b) return false;
  return amt<=p.purse-(slots-1)*MINB;
}
function startItem(s,now){
  const pl=s.pool[s.i]; const m={aggressive:1.6,balanced:1.1,frugal:0.75}[s.p.B&&s.p.B.bot]||1;
  s.bv=Math.round(pl.b*(1.2+Math.random()*2.2)*m/5)*5;
  s.bid={amt:0,by:null,end:now+11000};
}
function advance(s,now){
  s.i++;
  const full=['A','B'].every(k=>s.p[k].sq.length>=11);
  if(full){s.status='done';return s;}
  if(s.i>=s.pool.length){
    if(s.round>=3){s.status='done';return s;}
    const extra=s.res.splice(0,6);
    s.pool=byRole([...s.unsold,...extra]);s.unsold=[];s.i=0;s.round++;
    s.last+=` — RE-AUCTION round ${s.round}!`;
    if(!s.pool.length){s.status='done';return s;}
  }
  // skip players nobody can bid for
  let guard=0;
  while(s.i<s.pool.length&&!['A','B'].some(k=>canBid(s,k,s.pool[s.i].b))&&guard++<40){s.unsold.push(s.pool[s.i]);s.i++;}
  if(s.i>=s.pool.length) return advance({...s,i:s.pool.length-1},now);
  startItem(s,now);return s;
}
function step(s,now){
  if(s.status!=='live') return s;
  const left=s.bid.end-now;
  if(left<=0){
    const n=JSON.parse(JSON.stringify(s)),pl=n.pool[n.i];
    if(n.bid.by){
      const w=n.p[n.bid.by];w.purse-=n.bid.amt;w.sq.push({...pl,c:n.bid.amt});
      n.last=`🔨 SOLD! ${pl.n} to ${w.name} for ${fmt(n.bid.amt)}!`;
      n.log.unshift(`${pl.n} → ${w.name} ${fmt(n.bid.amt)}`);
    } else {n.unsold.push(pl);n.last=`❌ ${pl.n} goes UNSOLD.`;n.log.unshift(`${pl.n} unsold`);}
    return advance(n,now);
  }
  const b=s.p.B; if(b&&b.id==='bot'&&s.bid.by!=='B'&&Math.random()<0.12){
    const pl=s.pool[s.i],has=s.bid.by!==null;
    const cnt=b.sq.filter(x=>x.r===pl.r).length;
    const need=cnt<IDEAL[pl.r]?1.35:cnt>IDEAL[pl.r]?0.5:1;
    const amt=has?s.bid.amt+[10,25,25,50][Math.floor(Math.random()*4)]:pl.b;
    if(amt<=s.bv*need&&canBid(s,'B',amt))
      return {...s,hype:s.hype+1,bid:{amt,by:'B',end:now+8000}};
  }
  return s;
}

function Roster({p,title,color}){
  const os=osn(p),slots=11-p.sq.length;
  return html`<div class="bg-slate-900 border-t-4 ${color} rounded-2xl p-3">
    <div class="font-black">${title} — ${p.sq.length}/11</div>
    <div class="space-y-1 my-2 max-h-36 overflow-y-auto text-sm">
      ${p.sq.map((x,k)=>html`<div key=${k} class="flex justify-between bg-slate-950 rounded px-2 py-1"><span class="truncate mr-1">${x.o?'🌍 ':''}${x.n} <i class="text-slate-500">${x.r}</i></span><b>${fmt(x.c)}</b></div>`)}
      ${!p.sq.length&&html`<div class="text-slate-500 italic">No players yet</div>`}
    </div>
    <div class="text-sm">💰 Purse remaining: <b>${fmt(p.purse)}</b></div>
    <div class="text-sm">🌍 Overseas: <b>${os}/4</b> • Need <b>${slots}</b> more</div>
  </div>`;
}

function App(){
  const [view,setView]=useState('menu');
  const [s,setS]=useState(null);
  const [now,setNow]=useState(Date.now());
  const [err,setErr]=useState('');
  const [bot,setBot]=useState('balanced');
  const [join,setJoin]=useState('');
  const [bidIn,setBidIn]=useState('');
  const [verdict,setVerdict]=useState(null);
  const [busy,setBusy]=useState(false);
  const R=useRef({s:null,side:'A',online:false,peer:null,conn:null,host:true,uid:'local'});
  const flash=m=>{setErr(m);setTimeout(()=>setErr(''),2200);};

  const sendState=n=>{
    R.current.s=n;setS(n);
    if(R.current.online&&R.current.conn&&R.current.conn.open){R.current.conn.send({type:'state',state:n});}
  };

  const setupHost=()=>{
    const code=Math.random().toString(36).slice(2,6).toUpperCase();
    const peer=new Peer('ipl-'+code.toLowerCase());
    R.current={...R.current,peer,host:true,side:'A',online:true,uid:'host'};
    peer.on('open',()=>{R.current.roomCode=code; const g=newGame('host','Host',null); R.current.s=g; setS(g); setView('lobby');});
    peer.on('connection',conn=>{
      if(R.current.conn){conn.close();return;}
      R.current.conn=conn;
      conn.on('open',()=>conn.send({type:'state',state:R.current.s}));
      conn.on('data',msg=>{
        if(msg.type==='join'){
          const n=JSON.parse(JSON.stringify(R.current.s));
          if(n.status!=='lobby'||n.p.B)return conn.send({type:'error',message:'Room unavailable'});
          n.p.B={id:'friend',name:msg.name||'Friend',purse:10000,sq:[]};
          sendState(n);
        } else if(msg.type==='bid'){
          const cur=R.current.s;
          if(cur&&cur.status==='live'){
            const side='B';
            if(canBid(cur,side,msg.amt)&&(!cur.bid.by||msg.amt>cur.bid.amt)&&cur.bid.by!==side){
              sendState({...cur,hype:cur.hype+1,bid:{amt:msg.amt,by:side,end:Date.now()+8000}});
            }
          }
        }
      });
      conn.on('close',()=>{if(R.current.conn===conn)R.current.conn=null;});
    });
    peer.on('error',e=>flash('Connection error: '+(e.type||'unknown')));
  };

  const setupJoin=code=>{
    const peer=new Peer();
    R.current={...R.current,peer,host:false,side:'B',online:true,roomCode:code};
    peer.on('open',()=>{
      const conn=peer.connect('ipl-'+code.toLowerCase(),{reliable:true});
      R.current.conn=conn;
      conn.on('open',()=>conn.send({type:'join',name:'Friend'}));
      conn.on('data',msg=>{
        if(msg.type==='state'){R.current.s=msg.state;setS(msg.state);setView(v=>msg.state.status==='done'?'end':(msg.state.status==='live'?'play':v));}
        if(msg.type==='error')flash(msg.message);
      });
      conn.on('close',()=>flash('Host disconnected'));
    });
    peer.on('error',e=>flash(e.type==='peer-unavailable'?'Room not found':'Connection error: '+e.type));
  };

  const host=()=>setupHost();
  const joinRoom=()=>{const code=join.trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(code))return flash('Enter the 4-character room code');setupJoin(code);setView('lobby');};


  useEffect(()=>{
    const id=setInterval(()=>{
      setNow(Date.now());
      const r=R.current,cur=r.s;
      if(cur&&cur.status==='live'&&r.side==='A'){const n=step(cur,Date.now());if(n!==cur)sendState(n);}
    },200);
    return()=>clearInterval(id);
  },[]);
  useEffect(()=>{if(s&&s.status==='done'&&view==='play')setView('end');},[s,view]);

  const startBot=()=>{
    if(R.current.peer)R.current.peer.destroy(); R.current={...R.current,side:'A',online:false,peer:null,conn:null,host:true};
    const g=newGame(R.current.uid,'You',bot);g.status='live';startItem(g,Date.now());
    g.last='🎙️ Welcome to the IPL Auction! First up...';sendState(g);setView('play');
  };
  const begin=()=>{const n=JSON.parse(JSON.stringify(R.current.s));n.status='live';startItem(n,Date.now());n.last='🎙️ Ladies and gentlemen, the auction begins!';sendState(n);setView('play');};
  const bid=amt=>{
    const cur=R.current.s,side=R.current.side;
    if(!canBid(cur,side,amt)) return flash('Not allowed: purse, overseas cap or squad limit');
    if(cur.bid.by&&amt<=cur.bid.amt) return flash('Bid too low');
    if(cur.bid.by===side) return flash('You already lead');
    if(side==='B'&&R.current.conn){R.current.conn.send({type:'bid',amt});}
    else sendState({...cur,hype:cur.hype+1,bid:{amt,by:side,end:Date.now()+8000}});
    setBidIn('');
  };

  const summon=()=>{
    setBusy(true);
    const a=s.p.A,b=s.p.B;
    const score=p=>{
      const c={B:0,W:0,A:0,P:0,S:0};p.sq.forEach(x=>c[x.r]++);
      return Math.min(100,Math.round(c.B*8+c.W*10+c.A*9+c.P*9+c.S*8+(p.sq.length===11?10:0)-(Math.max(0,c.B-5)*3)));
    };
    const sa=score(a),sb=score(b);
    setVerdict({xiA:a.sq.slice(0,11).map(x=>x.n),xiB:b.sq.slice(0,11).map(x=>x.n),strengthsA:'Squad balance based on role coverage and completed roster.',weaknessesA:'Final XI depends on actual match conditions.',strengthsB:'Squad balance based on role coverage and completed roster.',weaknessesB:'Final XI depends on actual match conditions.',winner:sa===sb?'Draw':(sa>sb?a.name:b.name),verdict:`Local commissioner score: ${a.name} ${sa} vs ${b.name} ${sb}. This is a rule-based roster assessment, not an AI judgment.`});
    setBusy(false);
  };

  const wrap="min-h-screen p-4 max-w-2xl mx-auto",btn="rounded-xl font-bold py-3 px-4 transition-colors";
  const me=R.current.side,opp=me==='A'?'B':'A';

  if(view==='menu') return html`<div class=${wrap+' text-center pt-12'}>
    <div class="text-6xl">🏏</div>
    <h1 class="text-4xl font-black text-amber-400 my-3">IPL AUCTION SHOWDOWN</h1>
    <p class="text-slate-400 mb-6">₹100 Cr each • 11 players • max 4 overseas • 30 random stars</p>
    <div class="flex gap-2 justify-center mb-3">
      ${['aggressive','balanced','frugal'].map(b=>html`<button key=${b} onClick=${()=>setBot(b)} class="${btn} text-sm ${bot===b?'bg-amber-500 text-black':'bg-slate-800'}">${b}</button>`)}
    </div>
    <button onClick=${startBot} class="${btn} w-full bg-blue-600 hover:bg-blue-500 text-xl py-4 mb-6">🤖 Play vs Bot</button>
    <button onClick=${host} class="${btn} w-full bg-emerald-600 hover:bg-emerald-500 text-xl py-4 mb-3">🌐 Host Online Room</button>
    <div class="flex gap-2"><input value=${join} onInput=${e=>setJoin(e.target.value)} placeholder="ROOM CODE" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 uppercase tracking-widest outline-none"/>
    <button onClick=${joinRoom} class="${btn} bg-emerald-700">Join</button></div>
    <p class="text-red-400 h-6 mt-3">${err}</p></div>`;

  if(view==='lobby'&&s) return html`<div class=${wrap+' text-center pt-16'}>
    <div class="text-slate-400 uppercase text-sm">Room code</div>
    <div class="text-6xl font-black text-emerald-400 tracking-widest mb-6">${R.current.roomCode}</div>
    <p class="mb-6">Players: <b>${s.p.B?2:1}/2</b></p>
    ${me==='A'?html`<button disabled=${!s.p.B} onClick=${begin} class="${btn} w-full bg-emerald-600 disabled:bg-slate-800 text-xl py-4">${s.p.B?'Start Auction!':'Waiting for friend...'}</button>`:html`<p class="animate-pulse">Waiting for host to start...</p>`}
    <p class="text-slate-500 text-sm mt-6">Send this game URL to your friend. They only need the room code — no Claude login.</p></div>`;

  if(view==='play'&&s&&s.status==='live'){
    const pl=s.pool[s.i],left=Math.max(0,s.bid.end-now),has=!!s.bid.by,mine=s.bid.by===me;
    const remain=s.pool.slice(s.i+1).filter(x=>x.r===pl.r);
    const next=inc=>has?s.bid.amt+inc:pl.b+(inc-25);
    const cant=pl.o&&osn(s.p[me])>=4;
    let call=!has?'🎙️ Who will open the bidding?':left<800?'🔨 LAST CALL!':left<1800?'Going twice...':left<3000?'Going once...':s.bid.amt>=500?'🔥 Bidding war!':'🎙️ Bid is live!';
    return html`<div class=${wrap}>
      <div class="text-sm text-amber-300 mb-2 min-h-[20px]">${s.last}</div>
      <div class="flex justify-between text-xs text-slate-400"><span>${ROLES[pl.r]} • Player ${s.i+1}/${s.pool.length} • Round ${s.round}</span><b class="text-lg ${left<2500?'text-red-500':'text-white'}">${(left/1000).toFixed(1)}s</b></div>
      <div class="bg-slate-900 rounded-2xl p-4 text-center my-2 border ${has?(mine?'border-blue-500':'border-red-500'):'border-slate-800'}">
        <div class="text-3xl font-black">${pl.n}</div>
        <div class="text-sm text-slate-400">${ROLES[pl.r]} ${pl.o?'• 🌍 Overseas':'• 🇮🇳 Indian'} • Base ${fmt(pl.b)}</div>
        <div class="text-4xl font-black text-emerald-400 my-2">${has?fmt(s.bid.amt):'---'}</div>
        <div class="text-sm font-bold">${has?(mine?'Winning: YOU':'Winning: '+s.p[opp].name):'No bids yet'}</div>
        <div class="text-amber-400 font-bold mt-1">${call}</div>
      </div>
      <div class="grid grid-cols-4 gap-2 mb-2">
        ${[25,50,100,200].map(i=>html`<button key=${i} disabled=${mine||cant} onClick=${()=>bid(next(i))} class="${btn} py-2 text-sm bg-slate-800 disabled:opacity-40">${has?'+'+(i/100):fmt(next(i)).replace('₹','')}</button>`)}
      </div>
      <div class="flex gap-2"><input type="number" step="0.25" value=${bidIn} onInput=${e=>setBidIn(e.target.value)} placeholder="Custom bid in Cr" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 outline-none"/>
      <button disabled=${mine||!bidIn} onClick=${()=>bid(Math.round(parseFloat(bidIn)*100))} class="${btn} bg-blue-600 disabled:opacity-40">BID</button></div>
      <p class="text-red-400 h-6 text-center font-bold">${err||(cant?'Overseas limit reached — you cannot bid':'')}</p>
      <div class="text-xs text-slate-400 mb-3">Remaining ${ROLES[pl.r]} (${remain.length}): ${remain.map(x=>x.n).join(', ')||'none'}</div>
      <div class="grid grid-cols-2 gap-2 mb-3"><${Roster} p=${s.p[me]} title="ME" color="border-blue-500"/><${Roster} p=${s.p[opp]} title=${s.p[opp].name.toUpperCase()} color="border-red-500"/></div>
    </div>`;
  }

  if(view==='end'&&s){
    const v=verdict;
    return html`<div class=${wrap}>
      <div class="text-center mb-4"><div class="text-5xl">🏆</div><h1 class="text-3xl font-black">Auction Complete!</h1></div>
      <div class="grid grid-cols-2 gap-2 mb-4"><${Roster} p=${s.p[me]} title="ME" color="border-blue-500"/><${Roster} p=${s.p[opp]} title=${s.p[opp].name.toUpperCase()} color="border-red-500"/></div>
      <div class="bg-slate-900 border border-purple-500/40 rounded-2xl p-4 mb-4">
        <h2 class="font-black text-lg mb-2">👑 Commissioner's Verdict</h2>
        ${!v&&html`<button onClick=${summon} disabled=${busy} class="${btn} w-full bg-purple-600 disabled:opacity-50">${busy?'Building both XIs...':'Summon the Commissioner (AI)'}</button>`}
        ${v&&html`<div class="text-sm space-y-2">
          ${v.xiA&&html`<p><b>XI (${s.p.A.name}):</b> ${v.xiA.join(', ')}</p><p><b>XI (${s.p.B.name}):</b> ${v.xiB.join(', ')}</p>
          <p>✅ ${s.p.A.name}: ${v.strengthsA} ⚠️ ${v.weaknessesA}</p><p>✅ ${s.p.B.name}: ${v.strengthsB} ⚠️ ${v.weaknessesB}</p>
          <p class="text-lg font-black text-amber-400">Winner: ${v.winner}</p>`}
          <p>${v.verdict}</p></div>`}
      </div>
      <div class="text-xs text-slate-400 mb-4"><b>Sold log</b><br/>${s.log.slice(0,30).join(' • ')}</div>
      <button onClick=${()=>{if(R.current.peer)R.current.peer.destroy();R.current.s=null;R.current.online=false;R.current.peer=null;R.current.conn=null;setS(null);setVerdict(null);setView('menu');}} class="${btn} w-full bg-slate-800">Play Again</button></div>`;
  }
  return null;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
